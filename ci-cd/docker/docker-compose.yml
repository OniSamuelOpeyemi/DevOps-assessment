services:
  backend:
    build:
      context: .
      dockerfile: ci-cd/docker/Dockerfile.backend
    container_name: backend
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: ci-cd/docker/Dockerfile.frontend
    container_name: frontend
    ports:
      - "8082:80"
    depends_on:
      - backend
      