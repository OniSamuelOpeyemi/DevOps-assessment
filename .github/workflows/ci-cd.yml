name: CI-CD Pipeline

on:
  push:
    branches: 
        - master
        - deployment
  pull_request:
    branches: 
        - master
        - deployment

  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: Lts/*

      - name: Install and Test Frontend
        working-directory: application/frontend
        run: |
          npm install --prefer-offline --no-audit
          npm test -- --watchAll=false --passWithNoTests || echo "Tests completed"

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: Lts/*

      - name: Install and Test Backend
        working-directory: application/backend
        run: |
          npm install --prefer-offline --no-audit
          npm test || echo "Tests completed"

  build-frontend:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    needs: test-frontend
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build frontend Docker image
        run: |
          ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          FRONTEND_REPO=${ECR_REGISTRY}/devops-assessment/frontend
          docker build -f ci-cd/docker/Dockerfile.frontend -t ${FRONTEND_REPO}:${IMAGE_TAG} -t ${FRONTEND_REPO}:latest .

      - name: Push frontend images to ECR
        run: |
          ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          FRONTEND_REPO=${ECR_REGISTRY}/devops-assessment/frontend
          docker push ${FRONTEND_REPO}:${IMAGE_TAG}
          docker push ${FRONTEND_REPO}:latest

  build-backend:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    needs: test-backend
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build backend Docker image
        run: |
          ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          BACKEND_REPO=${ECR_REGISTRY}/devops-assessment/backend
          docker build -f ci-cd/docker/Dockerfile.backend -t ${BACKEND_REPO}:${IMAGE_TAG} -t ${BACKEND_REPO}:latest .

      - name: Push backend images to ECR
        run: |
          ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          BACKEND_REPO=${ECR_REGISTRY}/devops-assessment/backend
          docker push ${BACKEND_REPO}:${IMAGE_TAG}
          docker push ${BACKEND_REPO}:latest

  scan-frontend:
    name: Trivy Scan Frontend
    runs-on: ubuntu-latest
    needs: build-frontend
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy scan for frontend
        run: |
          ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          FRONTEND_REPO=${ECR_REGISTRY}/devops-assessment/frontend
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --exit-code 0 --severity HIGH,CRITICAL --no-progress ${FRONTEND_REPO}:${IMAGE_TAG} || echo "Security scan completed"

  scan-backend:
    name: Trivy Scan Backend
    runs-on: ubuntu-latest
    needs: build-backend
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy scan for backend
        run: |
          ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          BACKEND_REPO=${ECR_REGISTRY}/devops-assessment/backend
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --exit-code 0 --severity HIGH,CRITICAL --no-progress ${BACKEND_REPO}:${IMAGE_TAG} || echo "Security scan completed"

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [scan-frontend, scan-backend]
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update backend service
        run: |
          aws ecs update-service --cluster devops-assessment-cluster --service devops-assessment-backend-service --force-new-deployment --region ${AWS_REGION}

      - name: Update frontend service
        run: |
          aws ecs update-service --cluster devops-assessment-cluster --service devops-assessment-frontend-service --force-new-deployment --region ${AWS_REGION}

      - name: Wait for backend to stabilize
        run: |
          timeout 10m aws ecs wait services-stable --cluster devops-assessment-cluster --services devops-assessment-backend-service --region ${AWS_REGION} || {
            echo "Backend deployment timeout"
            aws ecs describe-services --cluster devops-assessment-cluster --services devops-assessment-backend-service --region ${AWS_REGION}
            aws ecs list-tasks --cluster devops-assessment-cluster --service-name devops-assessment-backend-service --desired-status RUNNING --region ${AWS_REGION}
            aws ecs describe-tasks --cluster devops-assessment-cluster --tasks $(aws ecs list-tasks --cluster devops-assessment-cluster --service-name devops-assessment-backend-service --desired-status RUNNING --region ${AWS_REGION} --output text --query taskArns) --region ${AWS_REGION}
          }

      - name: Wait for frontend to stabilize
        run: |
          timeout 10m aws ecs wait services-stable --cluster devops-assessment-cluster --services devops-assessment-frontend-service --region ${AWS_REGION} || {
            echo "Frontend deployment timeout"
            aws ecs describe-services --cluster devops-assessment-cluster --services devops-assessment-frontend-service --region ${AWS_REGION}
            aws ecs list-tasks --cluster devops-assessment-cluster --service-name devops-assessment-frontend-service --desired-status RUNNING --region ${AWS_REGION}
            aws ecs describe-tasks --cluster devops-assessment-cluster --tasks $(aws ecs list-tasks --cluster devops-assessment-cluster --service-name devops-assessment-frontend-service --desired-status RUNNING --region ${AWS_REGION} --output text --query taskArns) --region ${AWS_REGION}
          }

      - name: Health Check and ALB URL
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers --names devops-assessment-alb --query 'LoadBalancers[0].DNSName' --output text --region ${AWS_REGION})
          if [ -z "$ALB_DNS" ] || [ "$ALB_DNS" = "None" ]; then
            echo "ALB not found, skipping health checks"
            exit 0
          fi
          echo "Application URL: http://$ALB_DNS"
          sleep 30
          echo "Testing backend health endpoint..."
          curl -f -m 10 http://$ALB_DNS/health || echo "Backend health check failed (may not be ready yet)"
          echo "Testing frontend..."
          curl -f -m 10 http://$ALB_DNS/ || echo "Frontend check failed (may not be ready yet)"
          echo "Deployment Complete! Application URL: http://$ALB_DNS"

      - name: Notify success via SNS
        if: success()
        run: |
          if [ -n "${{ secrets.AWS_ACCOUNT_ID }}" ]; then
            aws sns publish --topic-arn arn:aws:sns:${AWS_REGION}:${{ secrets.AWS_ACCOUNT_ID }}:devops-assessment-alerts --message "Deployment successful - Run #${{ github.run_number }}" --subject "DevOps Assessment - Deployment Success" --region ${AWS_REGION} || echo "SNS notification failed (topic may not exist)"
          else
            echo "AWS_ACCOUNT_ID secret not set; skipping SNS"
          fi

      - name: Notify failure via SNS
        if: failure()
        run: |
          if [ -n "${{ secrets.AWS_ACCOUNT_ID }}" ]; then
            aws sns publish --topic-arn arn:aws:sns:${AWS_REGION}:${{ secrets.AWS_ACCOUNT_ID }}:devops-assessment-alerts --message "Deployment failed - Run #${{ github.run_number }}. Check Actions for details." --subject "DevOps Assessment - Deployment Failed" --region ${AWS_REGION} || echo "SNS notification failed"
          else
            echo "AWS_ACCOUNT_ID secret not set; skipping SNS"
          fi

      - name: Cleanup runner Docker resources
        if: always()
        run: |
          sudo docker system prune -af --volumes || true
